services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DB_PATH: /data/app.db
      CORS_ORIGIN: http://localhost:8080
    depends_on: [redis]
    volumes: [appdata:/data]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  appdata:
